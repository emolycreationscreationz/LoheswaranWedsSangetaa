<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5ead8" />
  <title>Loheswaran &amp; Sangetaa | Wedding Invitation</title>
  <meta name="description" content="With joyful hearts, we invite you to celebrate the wedding of Loheswaran and Sangetaa." />

  <!-- WhatsApp / social preview: after deploying, change og:image to the full URL -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Loheswaran &amp; Sangetaa | Wedding Invitation" />
  <meta property="og:description" content="You are invited to celebrate the wedding of Loheswaran and Sangetaa." />
  <meta property="og:image" content="assets/art/beach-mandap.svg" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235a0f17'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia' font-size='26' fill='%23e8c579'%3EL%26amp;S%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&family=Pinyon+Script&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=58" />
</head>
<body class="is-locked">

  <!-- ============ OPENING: TEMPLE DOORS ============ -->
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-label="Open the wedding invitation">
    <link rel="preload" as="image" href="assets/backgrounds/doors.webp">
    <div class="gate__stage" aria-hidden="true">
      <div class="gate__light"><span class="gate__rays"></span></div>
      <span class="gate__seam"></span>
      <div class="gate__door gate__door--left"></div>
      <div class="gate__door gate__door--right"></div>
    </div>
    <div class="gate__dust" aria-hidden="true"></div>
    <div class="gate__burst" aria-hidden="true"></div>
    <div class="gate__veil" aria-hidden="true"></div>

    <div class="gate__content">
      <p class="gate__eyebrow"><span>✦</span> With all our hearts <span>✦</span></p>
      <h1 class="gate__title">You are invited</h1>
      <p class="gate__sub">to celebrate the wedding of</p>
      <p class="gate__names" data-bind="couple"></p>
      <p class="gate__date" data-bind="dateShort"></p>
      <button class="gate__btn" id="openGate" type="button">
        <span class="gate__btn-text">Open Invitation</span>
      </button>
    </div>
  </div>

  <!-- background music (no controls) -->
  <audio id="bgm" preload="auto" loop playsinline></audio>

  <main class="page">

    <!-- ============ HERO ============ -->
    <section class="hero" id="top">
      <div class="hero__photo" aria-hidden="true"></div>
      <div class="thoranam" aria-hidden="true"></div>
      <div class="pillar pillar--left" aria-hidden="true"></div>
      <div class="pillar pillar--right" aria-hidden="true"></div>

      <div class="hero__inner">
        <p class="hero__quote reveal" data-bind="quote"></p>
        <h2 class="hero__names reveal">
          <span class="hero__name" data-bind="groom.short"></span>
          <span class="hero__weds">Weds</span>
          <span class="hero__name" data-bind="bride.short"></span>
        </h2>
        <div class="countdown reveal" id="countdown" aria-label="Countdown to the wedding">
          <div><b data-cd="d">00</b><small>Days</small></div>
          <div><b data-cd="h">00</b><small>Hours</small></div>
          <div><b data-cd="m">00</b><small>Min</small></div>
          <div><b data-cd="s">00</b><small>Sec</small></div>
        </div>
      </div>
      <div class="hero__scene" aria-hidden="true"></div>
    </section>

    <!-- ============ FAMILIES ============ -->
    <section class="families">
      <div class="families__leaves families__leaves--tl" aria-hidden="true"></div>
      <div class="families__leaves families__leaves--br" aria-hidden="true"></div>
      <div class="families__inner">
        <p class="eyebrow reveal" data-bind="familiesEyebrow"></p>
        <h2 class="section-title reveal">Our Families</h2>
        <span class="flourish-img reveal" aria-hidden="true"></span>
        <p class="families__intro reveal" data-bind="familiesIntro"></p>

        <div class="person reveal">
          <p class="eyebrow">The Groom</p>
          <h3 class="person__name"><span data-bind="groom.full"></span><small class="person__title" data-bind="groom.title"></small></h3>
          <span class="flourish-img flourish-img--sm" aria-hidden="true"></span>
          <p class="person__rel" data-bind="groom.relation"></p>
          <p class="person__parents" data-bind-html="groom.parentsHtml"></p>
          <p class="person__home" data-bind="groom.hometown"></p>
        </div>

        <p class="and reveal">And</p>

        <div class="person reveal">
          <p class="eyebrow">The Bride</p>
          <h3 class="person__name"><span data-bind="bride.full"></span><small class="person__title" data-bind="bride.title"></small></h3>
          <span class="flourish-img flourish-img--sm" aria-hidden="true"></span>
          <p class="person__rel" data-bind="bride.relation"></p>
          <p class="person__parents" data-bind-html="bride.parentsHtml"></p>
          <p class="person__home" data-bind="bride.hometown"></p>
        </div>

        <span class="flourish-img reveal" aria-hidden="true"></span>
      </div>
    </section>

    <!-- ============ THE VENUE ============ -->
    <section class="venue-page" id="venue">

      <div class="venue-page__inner">
        <p class="venue-page__label reveal" data-bind="venue.label"></p>
        <h2 class="venue-page__name reveal" data-bind="venue.name"></h2>
        <p class="venue-page__area reveal" data-bind="venue.area"></p>
        <div class="venue-page__btns reveal">
          <a class="btn-line" data-href="venue.googleMaps" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            Google Maps
          </a>
          <a class="btn-line" data-href="venue.waze" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>
            Waze
          </a>
        </div>
      </div>
    </section>

    <!-- ============ DRESS CODE ============ -->
    <section class="dress" id="dress-code">
      <div class="dress__pillar dress__pillar--left" aria-hidden="true"></div>
      <div class="dress__pillar dress__pillar--right" aria-hidden="true"></div>
      <div class="dress__mandala" aria-hidden="true"></div>
      <div class="dress__garland" aria-hidden="true"></div>
      <div class="dress__strand dress__strand--l1" aria-hidden="true"></div>
      <div class="dress__strand dress__strand--l2" aria-hidden="true"></div>
      <div class="dress__strand dress__strand--r1" aria-hidden="true"></div>
      <div class="dress__strand dress__strand--r2" aria-hidden="true"></div>
      <div class="dress__leaves dress__leaves--tl" aria-hidden="true"></div>
      <div class="dress__leaves dress__leaves--br" aria-hidden="true"></div>
      <div class="closing__sparkles dress__sparkles" aria-hidden="true"></div>
      <div class="dress__inner">
        <h2 class="attire-title reveal">
          <span class="attire-title__caps" data-bind="dressCode.title"></span>
          <span class="attire-title__script" data-bind="dressCode.script"></span>
        </h2>

        <figure class="dress__video reveal">
          <video id="dressVideo" muted loop playsinline preload="metadata" aria-label="The four outfits hanging in the palette colours"></video>
        </figure>

        <img class="dress__couples reveal" data-src-bind="dressCode.couples" alt="Two couples dressed in dark green, sage, cream and soft yellow traditional wear" loading="lazy">

        <div class="palette reveal" id="dressPalette"></div>
        <p class="dress__message reveal" data-bind="dressCode.message"></p>

        <div class="gentle reveal">
          <span class="gentle__rule" aria-hidden="true"><i></i><b></b><i></i></span>
          <h3 class="gentle__title" data-bind="dressCode.noteTitle"></h3>
          <p class="gentle__text" data-bind="dressCode.note"></p>
          <span class="gentle__rule" aria-hidden="true"><i></i><b></b><i></i></span>
        </div>
      </div>
    </section>

    <!-- ============ THE RECEPTION ============ -->
    <section class="reception" id="reception">
      <div class="reception__inner">
        <h2 class="reception__heading reveal"><span class="reception__the">The</span> <span class="reception__word">Reception</span></h2>
        <span class="flourish-img reception__flourish reveal" aria-hidden="true"></span>
        <p class="reception__intro reveal" data-bind-html="reception.introHtml"></p>
        <div class="datebar reveal" aria-label="Reception date and time">
          <p class="datebar__month" data-bind="reception.month"></p>
          <div class="datebar__row">
            <span class="datebar__side" data-bind="reception.weekday"></span>
            <span class="datebar__day" data-bind="reception.day"></span>
            <span class="datebar__side" data-bind="reception.time"></span>
          </div>
          <p class="datebar__year" data-bind="reception.year"></p>
        </div>
        <h3 class="reception__venue reveal" data-bind-html="reception.venueHtml"></h3>
        <div class="venue-page__btns reveal">
          <a class="btn-line" data-href="reception.googleMaps" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            Google Maps
          </a>
          <a class="btn-line" data-href="reception.waze" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>
            Waze
          </a>
        </div>
      </div>
    </section>

    <!-- ============ THE WEDDING ============ -->
    <section class="wedding">
      <div class="wedding__scene" aria-hidden="true"></div>
      <div class="wedding__inner">
        <h2 class="section-title section-title--xl reveal">The Wedding</h2>
        <p class="lede lede--italic reveal" data-bind="wedding.subtitle"></p>

        <p class="eyebrow reveal">Location</p>
        <h3 class="city reveal" data-bind="wedding.city"></h3>

        <div class="schedule glass reveal" id="weddingSchedule"></div>

      </div>
    </section>

    <!-- ============ RSVP ============ -->
    <section class="rsvp" id="rsvp">
      <div class="rsvp__inner rsvp__card reveal">
        <span class="closing__corner closing__corner--tl" aria-hidden="true"></span>
        <span class="closing__corner closing__corner--tr" aria-hidden="true"></span>
        <span class="closing__corner closing__corner--bl" aria-hidden="true"></span>
        <span class="closing__corner closing__corner--br" aria-hidden="true"></span>
        <p class="rsvp__eyebrow" data-bind="rsvp.eyebrow"></p>
        <h2 class="rsvp__title">RSVP</h2>
        <span class="flourish-img" aria-hidden="true"></span>
        <p class="rsvp__deadline" data-bind="rsvp.deadline"></p>
        <p class="rsvp__intro" data-bind="rsvp.intro"></p>

        <form class="rsvp__form" id="rsvpForm" novalidate>
          <label class="field">
            <span>Name</span>
            <input type="text" name="name" autocomplete="name" maxlength="80" required placeholder="Your full name">
          </label>
          <label class="field">
            <span>Phone Number</span>
            <input type="tel" name="phone" autocomplete="tel" inputmode="tel" maxlength="20" required placeholder="e.g. 012-345 6789">
          </label>
          <label class="field">
            <span>Number of Pax</span>
            <select name="pax" required id="rsvpPax"></select>
          </label>
          <fieldset class="field field--choice">
            <legend>Meal Preference</legend>
            <div class="choices">
              <label class="choice"><input type="radio" name="meal" value="Vegetarian" required><span>Vegetarian</span></label>
              <label class="choice"><input type="radio" name="meal" value="Non-Vegetarian"><span>Non-Vegetarian</span></label>
            </div>
          </fieldset>
          <label class="field">
            <span>Wishes for the Couple</span>
            <textarea name="wishes" rows="3" maxlength="500" placeholder="Share your blessings..."></textarea>
          </label>
          <p class="rsvp__error" id="rsvpError" role="alert" hidden></p>
          <button class="btn btn--gold rsvp__submit" type="submit" id="rsvpSubmit">Send RSVP</button>
        </form>

        <div class="rsvp__thanks" id="rsvpThanks" hidden tabindex="-1">
          <span class="rsvp__check" aria-hidden="true">✓</span>
          <h3>Thank you!</h3>
          <p data-bind="rsvp.thanks"></p>
        </div>
      </div>
    </section>

    <!-- ============ CLOSING (last page) ============ -->
    <section class="closing" id="closing">
      <div class="closing__backdrop" aria-hidden="true"></div>
      <figure class="closing__photo-wrap reveal-photo">
        <img class="closing__photo" data-src-bind="closing.photo" alt="Loheswaran and Sangetaa walking hand in hand along the shore at sunset">
        <span class="closing__sun" aria-hidden="true"></span>
        <div class="closing__glints" aria-hidden="true"></div>
      </figure>
      <div class="closing__petals" aria-hidden="true"></div>
      <div class="closing__shade" aria-hidden="true"></div>

      <div class="closing__text">
        <span class="closing__heart reveal" aria-hidden="true">♥</span>
        <p class="closing__message reveal" data-bind-html="closing.messageHtml"></p>
        <span class="closing__flourish reveal" aria-hidden="true"><i></i><b></b><i></i></span>
        <p class="closing__signoff reveal" data-bind="closing.signoff"></p>
        <p class="closing__names reveal"><span data-bind="closing.names"></span></p>
        <footer class="credit">Created by <b>Emoly Creations</b></footer>
      </div>
    </section>
  </main>

  <script src="js/config.js?v=58"></script>
  <script src="js/app.js?v=58"></script>
</body>
</html>
